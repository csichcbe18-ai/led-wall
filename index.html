<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1a24; }
  body { font-family:'Noto Sans Tamil','Latha','Nirmala UI','Vijaya',Arial,sans-serif; }

  /* Layer 0: soft moving gradient. Always visible if no video loads. */
  #fallback { position:absolute; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(120deg,#12303f,#2a3f63,#47476e,#3c5a6b,#12303f);
    background-size:300% 300%; -webkit-animation:drift 40s ease-in-out infinite; animation:drift 40s ease-in-out infinite; }
  @-webkit-keyframes drift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  @keyframes drift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  /* Layer 1: background video, fades in once it is really playing */
  #bgvideo { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;
    opacity:0; -webkit-transition:opacity 1.5s ease; transition:opacity 1.5s ease; }
  #bgvideo.on { opacity:1; }

  /* Layer 2: calm dark veil so text stays readable on any video */
  #veil { position:absolute; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(rgba(6,16,26,.42), rgba(6,16,26,.60)); }

  /* Layer 3: text */
  #frame { position:absolute; top:0; left:0; right:0; bottom:0; padding:5% 7% 8% 7%;
    display:-webkit-flex; display:flex; -webkit-flex-direction:column; flex-direction:column;
    -webkit-justify-content:center; justify-content:center; -webkit-align-items:center; align-items:center;
    text-align:center; box-sizing:border-box; }
  #content { max-width:100%; -webkit-transition:opacity .9s ease; transition:opacity .9s ease; }
  #content.out { opacity:0; }
  #verse { color:#fff8ec; font-weight:700; line-height:1.45; margin:0;
    text-shadow:0 2px 14px rgba(0,0,0,.65); }
  #rule { width:56px; height:2px; background:#e9c987; opacity:.8; margin:.55em auto .5em auto; }
  #ref { color:#f1d596; font-weight:700; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.7); }

  #mark { position:absolute; left:3%; bottom:3%; font-size:11px; letter-spacing:2px; font-weight:700;
    color:rgba(255,255,255,.35); font-family:Arial,sans-serif; }
  #dbg { position:absolute; right:6px; top:6px; font:10px Arial,sans-serif; color:#9f9; background:rgba(0,0,0,.6);
    padding:2px 5px; display:none; }
</style>

<script>

   - If playback is choppy on the processor, change -720.mp4 to -360.mp4.        */

  "https://assets.mixkit.co/videos/34970/34970-720.mp4",  // spectacular sunrise over the clouds

  "https://assets.mixkit.co/videos/6851/6851-720.mp4",    // clouds drifting over a tropical beach horizon
  "https://assets.mixkit.co/videos/46146/46146-720.mp4",  // time lapse of a sky in the desert
  "https://assets.mixkit.co/videos/34977/34977-720.mp4"   // magical layer of blue clouds
];

/* ============ VERSES ============ */
/* The verse list lives in verses.js (loaded above). */
var ALL = (typeof bibleData !== "undefined" ? bibleData : []);
var verses = [];
for (var k = 0; k < ALL.length; k++) { if (ALL[k].v && ALL[k].r) verses.push(ALL[k]); }
if (!verses.length) verses = [{r:"சங்கீதம் 23:1", v:"கர்த்தர் என் மேய்ப்பராயிருக்கிறார்; நான் தாழ்ச்சியடையேன்."},
 {r:"எபிரெயர் 6:14", v:"உன்னை ஆசீர்வதிக்கவே ஆசீர்வதித்து, உன்னைப் பெருகவே பெருகப்பண்ணுவேன்."},
 {r:"மத்தேயு 11:28", v:"வருத்தப்பட்டுப் பாரஞ்சுமக்கிறவர்களே! நீங்கள் எல்லாரும் என்னிடத்தில் வாருங்கள்; நான் உங்களுக்கு இளைப்பாறுதல் தருவேன்."},
 {r:"லூக்கா 1:37", v:"தேவனாலே கூடாத காரியம் ஒன்றுமில்லை."},
 {r:"எபிரெயர் 13:5", v:"நான் உன்னைக் கைவிடுவதில்லை, உன்னை விட்டு விலகுவதுமில்லை."},
 {r:"ஏசாயா 40:31", v:"கர்த்தருக்குக் காத்திருக்கிறவர்களோ புதுப்பெலன் அடைவார்கள்."},
 {r:"நீதிமொழிகள் 3:6", v:"உன் வழிகளிலெல்லாம் அவரை நினைத்துக்கொள், அப்பொழுது அவர் உன் பாதைகளைச் செவ்வைப்படுத்துவார்."},
 {r:"மத்தேயு 28:20", v:"இதோ, உலகத்தின் முடிவுபரியந்தம் சகல நாட்களிலும் நான் உங்களுடனேகூட இருக்கிறேன்."},
 {r:"சங்கீதம் 46:1", v:"தேவன் நமக்கு அடைக்கலமும் பெலனும், ஆபத்துக்காலத்தில் அநுகூலமான துணையுமானவர்."},
 {r:"ஏசாயா 60:19", v:"கர்த்தர் உனக்கு வெளிச்சமாயிருப்பார், உன் தேவன் உனக்கு மகிமையாயிருப்பார்."},
 {r:"சங்கீதம் 55:22", v:"உன் பாரத்தைக் கர்த்தர்மேல் வைத்துவிடு, அவர் உன்னை ஆதரிப்பார்."},
 {r:"பிலிப்பியர் 4:13", v:"என்னைப் பெலப்படுத்துகிற கிறிஸ்துவினாலே எல்லாவற்றையும் செய்ய எனக்குப் பெலனுண்டு."},
 {r:"சங்கீதம் 118:6", v:"கர்த்தர் என் பட்சத்தில் இருக்கிறார், நான் பயப்படேன்; மனுஷன் எனக்கு என்ன செய்வான்?"},
 {r:"யாத்திராகமம் 15:11", v:"கர்த்தாவே, தேவர்களில் உமக்கு ஒப்பானவர் யார்? நீர் மகத்துவமுள்ளவர்."},
 {r:"எபிரெயர் 13:8", v:"இயேசு கிறிஸ்து நேற்றும் இன்றும் என்றென்றும் மாறாதவராயிருக்கிறார்."},
 {r:"ஏசாயா 41:10", v:"பயப்படாதே, நான் உன்னுடனே இருக்கிறேன்; திகையாதே, நான் உன் தேவன்."},
 {r:"1 யோவான் 4:8", v:"தேவன் அன்பாகவே இருக்கிறார்."},
 {r:"சங்கீதம் 23:6", v:"நன்மையும் கிருபையும் என் ஆயுளுள்ள நாளெல்லாம் என்னைத் தொடரும்."},
 {r:"2 தீமோத்தேயு 1:7", v:"தேவன் நமக்கு பயமுள்ள ஆவியைக் கொடாமல், பலமும் அன்பும் தெளிந்த புத்தியுமுள்ள ஆவியையே கொடுத்திருக்கிறார்."},
 {r:"சங்கீதம் 103:2", v:"என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி; அவர் செய்த சகல உபகாரங்களையும் மறவாதே."},
 {r:"மாற்கு 9:23", v:"விசுவாசிக்கிறவனுக்கு எல்லாம் கூடும்."},
 {r:"பிலிப்பியர் 4:6", v:"நீங்கள் ஒன்றுக்கும் கவலைப்படாமல், எல்லாவற்றையுங்குறித்து உங்கள் விண்ணப்பங்களை ஸ்தோத்திரத்துடனேகூடிய ஜெபத்தினாலும் வேண்டுதலினாலும் தேவனுக்குத் தெரியப்படுத்துங்கள்."},
 {r:"பிலிப்பியர் 4:4", v:"கர்த்தருக்குள் எப்போதும் சந்தோஷமாயிருங்கள்; சந்தோஷமாயிருங்கள் என்று மறுபடியும் சொல்லுகிறேன்."},
 {r:"ரோமர் 8:28", v:"தேவனிடத்தில் அன்புகூருகிறவர்களுக்குச் சகலமும் நன்மைக்கு ஏதுவாக நடக்கிறதென்று அறிந்திருக்கிறோம்."},
 {r:"சங்கீதம் 119:105", v:"உம்முடைய வசனம் என் கால்களுக்குத் தீபமும், என் பாதைக்கு வெளிச்சமுமாய் இருக்கிறது."},
 {r:"சங்கீதம் 102:16", v:"சீயோனைக் கட்டுகிற கர்த்தர் தமது மகிமையில் வெளிப்படுவார்."},
 {r:"1 பேதுரு 5:7", v:"அவர் உங்களை விசாரிக்கிறவரானதால், உங்கள் கவலைகளையெல்லாம் அவர்மேல் வைத்துவிடுங்கள்."},
 {r:"சங்கீதம் 34:19", v:"நீதிமானுக்கு வரும் துன்பங்கள் பலவாயிருக்கும், கர்த்தர் அவையெல்லாவற்றினின்றும் அவனை விடுவிப்பார்."},
 {r:"எண்ணாகமம் 6:24", v:"கர்த்தர் உன்னை ஆசீர்வதித்து, உன்னைக் காக்கக்கடவர்."},
 {r:"மத்தேயு 7:7", v:"கேளுங்கள், அப்பொழுது உங்களுக்குக் கொடுக்கப்படும்; தேடுங்கள், அப்பொழுது கண்டடைவீர்கள்."},
 {r:"யோவான் 14:14", v:"என் நாமத்தினால் நீங்கள் எதைக் கேட்பீர்களோ அதை நான் செய்வேன்."},
 {r:"லூக்கா 5:31-32", v:"ஆரோக்கியமுள்ளவர்களுக்கு அல்ல, பிணியாளிகளுக்கே வைத்தியன் தேவை; நீதிமான்களையல்ல, பாவிகளையே மனந்திரும்புகிறதற்கு அழைக்க வந்தேன்."},
 {r:"மத்தேயு 6:33", v:"முதலாவது தேவனுடைய ராஜ்யத்தையும் அவருடைய நீதியையும் தேடுங்கள்; அப்பொழுது இவைகளெல்லாம் உங்களுக்குக் கூடக் கொடுக்கப்படும்."},
 {r:"மத்தேயு 4:4", v:"மனுஷன் அப்பத்தினாலே மாத்திரமல்ல, தேவனுடைய வாயிலிருந்து புறப்படுகிற ஒவ்வொரு வார்த்தையினாலும் பிழைப்பான்."},
 {r:"யாத்திராகமம் 14:14", v:"கர்த்தர் உங்களுக்காக யுத்தம் பண்ணுவார், நீங்கள் சும்மாயிருப்பீர்கள்."},
 {r:"சங்கீதம் 27:1", v:"கர்த்தர் என் வெளிச்சமும் என் இரட்சிப்புமானவர், யாருக்குப் பயப்படுவேன்?"},
 {r:"செப்பனியா 3:17", v:"உன் தேவனாகிய கர்த்தர் உன்னோடு இருக்கிறார்; அவர் வல்லமையுள்ளவர், அவர் உன்னை இரட்சிப்பார்."},
 {r:"யோசுவா 1:9", v:"நான் உனக்குக் கட்டளையிடவில்லையா? திடமனதாயிரு, பலங்கொள், திகையாதே, கலங்காதே."},
 {r:"நாகூம் 1:7", v:"கர்த்தர் நல்லவர், ஆபத்துநாளில் அரணான கோட்டை; தம்மை நம்புகிறவர்களை அவர் அறிந்திருக்கிறார்."},
 {r:"ஆதியாகமம் 28:15", v:"இதோ, நான் உனக்குக் கொடுத்த வாக்குத்தத்தத்தை நிறைவேற்றுமளவும் உன்னைக் கைவிடுவதில்லை."},
 {r:"யோவான் 14:1", v:"உங்கள் இருதயம் கலங்காதிருப்பதாக; தேவனிடத்தில் விசுவாசமாயிருங்கள், என்னிடத்திலும் விசுவாசமாயிருங்கள்."},
 {r:"சங்கீதம் 147:3", v:"அவர் உடைந்த இருதயமுள்ளவர்களைக் குணமாக்குகிறார், அவர்களுடைய காயங்களைக் கட்டுகிறார்."},
 {r:"யாக்கோபு 5:16", v:"நீதிமான்களுடைய ஜெபம் தேவனுக்குப் பிரியம், அது மிகுந்த பலனுள்ளது."},
 {r:"சங்கீதம் 16:11", v:"உம்முடைய பிரசன்னம் எனக்கு ஜீவவழியைக் காட்டும்; உம்முடைய வலதுபாரிசத்தில் நித்திய பேரின்பம் உண்டு."},
 {r:"1 தெசலோனிக்கேயர் 5:23", v:"சமாதானத்தின் தேவன் தாமே உங்களை முற்றிலும் பரிசுத்தமாக்குவாராக."},
 {r:"சங்கீதம் 42:5", v:"என் ஆத்துமாவே, நீ ஏன் கலங்குகிறாய்? தேவனை நோக்கிக் காத்திரு; இன்னும் அவரைத் துதிப்பேன்."},
 {r:"எபிரெயர் 12:29", v:"நம்முடைய தேவன் பட்சிக்கிற அக்கினியாயிருக்கிறார்."},
 {r:"சங்கீதம் 145:3", v:"கர்த்தர் பெரியவர், அவர் மிகவும் துதிக்கப்படத்தக்கவர்; அவருடைய மகத்துவம் ஆராய்ந்து முடியாதது."},

/* ============ CODE (no need to edit below) ============ */
function $(id){ return document.getElementById(id); }
function query(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : null;
}
function shuffle(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var debug = query('debug') !== null;
if (debug) $('dbg').style.display = 'block';
function log(t){ if (debug) $('dbg').innerHTML = t; }

/* ---- verses: shuffled deck, no repeats until all shown ---- */
var deck = [], vi = 0;
function nextVerse(){
  if (vi >= deck.length) { deck = shuffle(verses); vi = 0; }
  return deck[vi++];
}

/* ---- auto-fit: the verse always fits the screen, whatever its length ---- */
function fit(){
  var H = window.innerHeight || 384;
  var frame = $('frame'), content = $('content'), verse = $('verse'), ref = $('ref');
  var avail = H * 0.84;
  var size = Math.round(H * 0.125);          // start large (about 48px on a 384px-high area)
  var min = Math.round(H * 0.05);
  while (size >= min) {
    verse.style.fontSize = size + 'px';
    ref.style.fontSize = Math.round(size * 0.62) + 'px';
    if (content.offsetHeight <= avail) break;
    size -= 2;
  }
}
function showVerse(first){
  var c = $('content'), n = nextVerse();
  var apply = function(){
    $('verse').innerHTML = n.v;
    $('ref').innerHTML = n.r;
    fit();
    c.className = '';
  };
  if (first) { apply(); return; }
  c.className = 'out';
  setTimeout(apply, 950);
}

/* ---- background video: skip bad links, never leave a black screen ---- */
var vid = $('bgvideo'), order = [], vp = 0, failCount = 0, watchdog = null;
function loadVideo(){
  if (!VIDEOS.length) return;
  if (failCount >= VIDEOS.length) { vid.className = ''; log('all videos failed - gradient only'); return; }
  if (vp >= order.length) { order = shuffle(VIDEOS); vp = 0; }
  var src = order[vp++];
  vid.className = '';
  clearTimeout(watchdog);
  vid.muted = true;
  vid.src = src;
  vid.load();
  var p = vid.play();
  if (p && p['catch']) p['catch'](function(){});
  log('loading: ' + src);
  watchdog = setTimeout(function(){ failCount++; loadVideo(); }, 12000);  // 12 s without playing = skip
}
vid.addEventListener('playing', function(){
  clearTimeout(watchdog); failCount = 0; vid.className = 'on'; log('playing: ' + vid.src);
});
vid.addEventListener('error', function(){ clearTimeout(watchdog); failCount++; loadVideo(); });

/* ---- start ---- */
deck = shuffle(verses);
var forced = query('v');                       // optional: index.html?v=3 shows verse number 3
if (forced !== null && verses[parseInt(forced, 10)]) { deck.unshift(verses[parseInt(forced, 10)]); }
showVerse(true);
loadVideo();
setInterval(function(){ showVerse(false); }, VERSE_SECONDS * 1000);
setInterval(function(){ loadVideo(); }, VIDEO_SECONDS * 1000);
window.onresize = fit;
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); }  // refit when Tamil font arrives
</script>
