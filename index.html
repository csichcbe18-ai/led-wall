  #bgvideo { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;
    opacity:0; -webkit-transition:opacity 1.5s ease; transition:opacity 1.5s ease; }
  #bgvideo.on { opacity:1; }

  #ref { color:#f1d596; font-weight:700; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.7); }

  #mark { position:absolute; left:3%; bottom:3%; font-size:11px; letter-spacing:2px; font-weight:700;
    color:rgba(255,255,255,.35); font-family:Arial,sans-serif; }

 {v:"கர்த்தர் என் மேய்ப்பராயிருக்கிறார்; நான் தாழ்ச்சியடையேன்.", r:"சங்கீதம் 23:1"},
 {v:"வருத்தப்பட்டுப் பாரஞ்சுமக்கிறவர்களே! நீங்கள் எல்லாரும் என்னிடத்தில் வாருங்கள்; நான் உங்களுக்கு இளைப்பாறுதல் தருவேன்.", r:"மத்தேயு 11:28"},
 {v:"உன் வழிகளிலெல்லாம் அவரை நினைத்துக்கொள்; அப்பொழுது அவர் உன் பாதைகளைச் செவ்வைப்படுத்துவார்.", r:"நீதிமொழிகள் 3:6"},
 {v:"கர்த்தர்மேல் உன் பாரத்தை வைத்துவிடு, அவர் உன்னை ஆதரிப்பார்; நீதிமானை ஒருபோதும் தள்ளாடவொட்டார்.", r:"சங்கீதம் 55:22"},
 {v:"என்னைப் பெலப்படுத்துகிற கிறிஸ்துவினாலே எல்லாவற்றையுஞ்செய்ய எனக்குப் பெலனுண்டு.", r:"பிலிப்பியர் 4:13"},
 {v:"இயேசுகிறிஸ்து நேற்றும் இன்றும் என்றும் மாறாதவராயிருக்கிறார்.", r:"எபிரெயர் 13:8"},
 {v:"அன்பில்லாதவன் தேவனை அறியான்; தேவன் அன்பாகவே இருக்கிறார்.", r:"1 யோவான் 4:8"},
 {v:"என் ஜீவனுள்ள நாளெல்லாம் நன்மையும் கிருபையும் என்னைத் தொடரும்; நான் கர்த்தருடைய வீட்டிலே நீடித்த நாள்களாய் நிலைத்திருப்பேன்.", r:"சங்கீதம் 23:6"},
 {v:"என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி; அவர் செய்த சகல உபகாரங்களையும் மறவாதே.", r:"சங்கீதம் 103:2"},
 {v:"கர்த்தருக்குள் எப்பொழுதும் சந்தோஷமாயிருங்கள்; சந்தோஷமாயிருங்கள் என்று மறுபடியும் சொல்லுகிறேன்.", r:"பிலிப்பியர் 4:4"},
 {v:"திக்கற்றவர்களுடைய ஜெபத்தை அலட்சியம்பண்ணாமல், அவர்கள் விண்ணப்பத்தை அங்கீகரிப்பார்.", r:"சங்கீதம் 102:16"},
 {v:"அவர் உங்களை விசாரிக்கிறவரானபடியால், உங்கள் கவலைகளையெல்லாம் அவர்மேல் வைத்துவிடுங்கள்.", r:"1 பேதுரு 5:7"},
 {v:"நீதிமானுக்கு வரும் துன்பங்கள் அநேகமாயிருக்கும், கர்த்தர் அவைகளெல்லாவற்றிலும் நின்று அவனை விடுவிப்பார்.", r:"சங்கீதம் 34:19"},
 {v:"கேளுங்கள், அப்பொழுது உங்களுக்குக் கொடுக்கப்படும்; தேடுங்கள், அப்பொழுது கண்டடைவீர்கள்; தட்டுங்கள், அப்பொழுது உங்களுக்குத் திறக்கப்படும்;", r:"மத்தேயு 7:7"},
 {v:"என் நாமத்தினாலே நீங்கள் எதைக்கேட்டாலும் அதை நான் செய்வேன்.", r:"யோவான் 14:14"},
 {v:"கர்த்தர் என் வெளிச்சமும் என் இரட்சிப்புமானவர், யாருக்குப் பயப்படுவேன்? கர்த்தர் என் ஜீவனின் அரணானவர், யாருக்கு அஞ்சுவேன்?", r:"சங்கீதம் 27:1"},
 {v:"கர்த்தர் நல்லவர், இக்கட்டு நாளிலே அரணான கோட்டை; தம்மை நம்புகிறவர்களை அறிந்திருக்கிறார்.", r:"நாகூம் 1:7"},
 {v:"உங்கள் இருதயம் கலங்காதிருப்பதாக; தேவனிடத்தில் விசுவாசமாயிருங்கள், என்னிடத்திலும் விசுவாசமாயிருங்கள்.", r:"யோவான் 14:1"},
 {v:"ஜீவமார்க்கத்தை எனக்குத் தெரியப்படுத்துவீர்; உம்முடைய சமுகத்தில் பரிபூரண ஆனந்தமும், உம்முடைய வலதுபாரிசத்தில் நித்திய பேரின்பமும் உண்டு.", r:"சங்கீதம் 16:11"},
 {v:"நம்முடைய தேவன் பட்சிக்கிற அக்கினியாயிருக்கிறாரே.", r:"எபிரெயர் 12:29"},
 {v:"உன் வழியைக் கர்த்தருக்கு ஒப்புவித்து, அவர்மேல் நம்பிக்கையாயிரு; அவரே காரியத்தை வாய்க்கப்பண்ணுவார்.", r:"சங்கீதம் 37:5"},
 {v:"ஆதியிலே தேவன் வானத்தையும் பூமியையும் சிருஷ்டித்தார்.", r:"ஆதியாகமம் 1:1"},
 {v:"நான் உன்னைப் பெரிய ஜாதியாக்கி, உன்னை ஆசீர்வதித்து, உன் பேரைப் பெருமைப்படுத்துவேன்; நீ ஆசீர்வாதமாய் இருப்பாய்.", r:"ஆதியாகமம் 12:2"},
 {v:"உன் தேவனாகிய கர்த்தர் உனக்குக் கொடுக்கிற தேசத்திலே உன் நாட்கள் நீடித்திருப்பதற்கு, உன் தகப்பனையும் உன் தாயையும் கனம்பண்ணுவாயாக.", r:"யாத்திராகமம் 20:12"},
 {v:"கர்த்தர் தம்முடைய முகத்தை உன்மேல் பிரகாசிக்கப்பண்ணி, உன்மேல் கிருபையாயிருக்கக்கடவர்.", r:"எண்ணாகமம் 6:25"},
 {v:"நீ உன் தேவனாகிய கர்த்தரிடத்தில் உன் முழு இருதயத்தோடும், உன் முழு ஆத்துமாவோடும், உன் முழுப் பலத்தோடும் அன்புக்கூருவாயாக.", r:"உபாகமம் 6:5"},
 {v:"கர்த்தரைத் துதியுங்கள், அவர் நல்லவர், அவர் கிருபை என்றுமுள்ளது.", r:"1 நாளாகமம் 16:34"},

 {v:"சமாதானத்தோடே படுத்துக்கொண்டு நித்திரைசெய்வேன்; கர்த்தாவே, நீர் ஒருவரே என்னைச் சுகமாய்த் தங்கப்பண்ணுகிறீர்.", r:"சங்கீதம் 4:8"},
 {v:"கர்த்தரை எப்பொழுதும் எனக்கு முன்பாக வைத்திருக்கிறேன்; அவர் என் வலதுபாரிசத்தில் இருக்கிறபடியால் நான் அசைக்கப்படுவதில்லை.", r:"சங்கீதம் 16:8"},
 {v:"என் கன்மலையும் என் மீட்பருமாகிய கர்த்தாவே, என் வாயின் வார்த்தைகளும், என் இருதயத்தின் தியானமும், உமது சமுகத்துக்குப் பிரியமாய் இருப்பதாக.", r:"சங்கீதம் 19:14"},

 {v:"ஏனெனில் அவருடைய கோபம் ஒர் இமைப்பொழுதே, அவருடைய தயவோ ஆயுள் காலம் வரை; சாயங்காலத்தில் அழுகை தங்கும், விடியற்காலத்திலே களிப்புண்டாகும்.", r:"சங்கீதம் 30:5"},
 {v:"நான் உனக்குப் போதித்து, நீ நடக்கவேண்டிய வழியை உனக்குக் காட்டுவேன்; உன்மேல் என் கண்ணை வைத்து, உனக்கு ஆலோசனை சொல்லுவேன்.", r:"சங்கீதம் 32:8"},
 {v:"கர்த்தரைத் தங்களுக்குத் தெய்வமாகக்கொண்ட ஜாதியும், அவர் தமக்குச் சுதந்தரமாகத் தெரிந்துகொண்ட ஜனமும் பாக்கியமுள்ளது.", r:"சங்கீதம் 33:12"},
 {v:"நொறுங்குண்ட இருதயமுள்ளவர்களுக்குக் கர்த்தர் சமீபமாயிருந்து, நருங்குண்ட ஆவியுள்ளவர்களை இரட்சிக்கிறார்.", r:"சங்கீதம் 34:18"},

 {v:"கர்த்தருக்காகப் பொறுமையுடன் காத்திருந்தேன்; அவர் என்னிடமாய்ச் சாய்ந்து, என் கூப்பிடுதலைக் கேட்டார்.", r:"சங்கீதம் 40:1"},
 {v:"நீங்கள் அமர்ந்திருந்து, நானே தேவனென்று அறிந்துகொள்ளுங்கள்; ஜாதிகளுக்குள்ளே உயர்ந்திருப்பேன், பூமியிலே உயர்ந்திருப்பேன்.", r:"சங்கீதம் 46:10"},
 {v:"ஆபத்துக்காலத்தில் என்னை நோக்கிக் கூப்பிடு; நான் உன்னை விடுவிப்பேன், நீ என்னை மகிமைப்படுத்துவாய்.", r:"சங்கீதம் 50:15"},
 {v:"தேவனையே நோக்கி என் ஆத்துமா அமர்ந்திருக்கிறது; அவரால் என் இரட்சிப்பு வரும்.", r:"சங்கீதம் 62:1"},
 {v:"தேவனே, பூமியில் உம்முடைய வழியும், எல்லா ஜாதிகளுக்குள்ளும் உம்முடைய இரட்சணியமும் விளங்கும்படியாய்,", r:"சங்கீதம் 67:1"},
 {v:"உன்னதமானவரின் மறைவிலிருக்கிறவன் சர்வவல்லவருடைய நிழலில் தங்குவான்.", r:"சங்கீதம் 91:1"},
 {v:"உன் வழிகளிலெல்லாம் உன்னைக் காக்கும்படி, உனக்காகத் தம்முடைய தூதர்களுக்குக் கட்டளையிடுவார்.", r:"சங்கீதம் 91:11"},
 {v:"அவர் வாசல்களில் துதியோடும், அவர் பிராகாரங்களில் புகழ்ச்சியோடும் பிரவேசித்து, அவரைத் துதித்து, அவருடைய நாமத்தை ஸ்தோத்திரியுங்கள்.", r:"சங்கீதம் 100:4"},
 {v:"கர்த்தர் நல்லவர், அவருடைய கிருபை என்றென்றைக்கும், அவருடைய உண்மை தலைமுறை தலைமுறைக்கும் உள்ளது.", r:"சங்கீதம் 100:5"},
 {v:"கர்த்தர் உருக்கமும், இரக்கமும், நீடிய சாந்தமும், மிகுந்த கிருபையுமுள்ளவர்.", r:"சங்கீதம் 103:8"},
 {v:"கர்த்தரைத் துதியுங்கள், அவர் நல்லவர்; அவர் கிருபை என்றுமுள்ளது.", r:"சங்கீதம் 118:1"},
 {v:"இது கர்த்தர் உண்டுபண்ணின நாள்; இதிலே களிகூர்ந்து மகிழக்கடவோம்.", r:"சங்கீதம் 118:24"},
 {v:"வானத்தையும் பூமியையும் உண்டாக்கின கர்த்தரிடத்திலிருந்து எனக்கு ஒத்தாசை வரும்.", r:"சங்கீதம் 121:2"},
 {v:"கர்த்தர் உன் போக்கையும் உன் வரத்தையும் இதுமுதற்கொண்டு என்றைக்குங் காப்பார்.", r:"சங்கீதம் 121:8"},
 {v:"கர்த்தருடைய ஆலயத்திற்குப் போவோம் வாருங்கள் என்று எனக்கு அவர்கள் சொன்னபோது மகிழ்ச்சியாயிருந்தேன்.", r:"சங்கீதம் 122:1"},
 {v:"கர்த்தருக்குக் காத்திருக்கிறேன்; என் ஆத்துமா காத்திருக்கிறது; அவருடைய வார்த்தையை நம்பியிருக்கிறேன்.", r:"சங்கீதம் 130:5"},
 {v:"இதோ, சகோதரர் ஒருமித்து வாசம்பண்ணுகிறது எத்தனை நன்மையும் எத்தனை இன்பமுமானது?", r:"சங்கீதம் 133:1"},
 {v:"தம்மை நோக்கிக் கூப்பிடுகிற யாவருக்கும், உண்மையாய்த் தம்மை நோக்கிக் கூப்பிடுகிற யாவருக்கும், கர்த்தர் சமீபமாயிருக்கிறார்.", r:"சங்கீதம் 145:18"},
 {v:"யாக்கோபின் தேவனைத் தன் துணையாகக் கொண்டிருந்து, தன் தேவனாகிய கர்த்தர்மேல் நம்பிக்கையை வைக்கிறவன் பாக்கியவான்.", r:"சங்கீதம் 146:5"},
 {v:"உன் சுயபுத்தியின்மேல் சாயாமல், உன் முழு இருதயத்தோடும் கர்த்தரில் நம்பிக்கையாயிருந்து,", r:"நீதிமொழிகள் 3:5"},
 {v:"உதாரகுணமுள்ள ஆத்துமா செழிக்கும்; எவன் தண்ணீர் பாய்ச்சுகிறானோ அவனுக்குத் தண்ணீர் பாய்ச்சப்படும்.", r:"நீதிமொழிகள் 11:25"},
 {v:"மெதுவான பிரதியுத்தரம் உக்கிரத்தை மாற்றும்; கடுஞ்சொற்களோ கோபத்தை எழுப்பும்.", r:"நீதிமொழிகள் 15:1"},
 {v:"கர்த்தரின் நாமம் பலத்த துருகம்; நீதிமான் அதற்குள் ஓடிச் சுகமாயிருப்பான்.", r:"நீதிமொழிகள் 18:10"},
 {v:"சிநேகிதருள்ளவன் சிநேகம் பாராட்டவேண்டும்; சகோதரனிலும் அதிக சொந்தமாய்ச் சிநேகிப்பவனுமுண்டு.", r:"நீதிமொழிகள் 18:24"},
 {v:"ஒவ்வொன்றிற்கும் ஒவ்வொரு காலமுண்டு; வானத்தின் கீழிருக்கிற ஒவ்வொரு காரியத்துக்கும் ஒவ்வொரு சமயமுண்டு.", r:"பிரசங்கி 3:1"},
 {v:"உன் தேவனாயிருக்கிற கர்த்தராகிய நான் உன் வலதுகையைப் பிடித்து: பயப்படாதே, நான் உனக்குத் துணைநிற்கிறேன் என்று சொல்லுகிறேன்.", r:"ஏசாயா 41:13"},
 {v:"கர்த்தர்மேல் நம்பிக்கைவைத்து, கர்த்தரைத் தன் நம்பிக்கையாகக்கொண்டிருக்கிற மனுஷன் பாக்கியவான்.", r:"எரேமியா 17:7"},
 {v:"நாம் நிர்மூலமாகாதிருக்கிறது கர்த்தருடைய கிருபையே, அவருடைய இரக்கங்களுக்கு முடிவில்லை.", r:"புலம்பல் 3:22"},
 {v:"அவைகள் காலைதோறும் புதியவைகள்; உமது உண்மை பெரிதாயிருக்கிறது.", r:"புலம்பல் 3:23"},
 {v:"நீங்கள் உலகத்துக்கு வெளிச்சமாயிருக்கிறீர்கள்; மலையின்மேல் இருக்கிற பட்டணம் மறைந்திருக்கமாட்டாது.", r:"மத்தேயு 5:14"},
 {v:"ஆகையால், நாளைக்காகக் கவலைப்படாதிருங்கள்; நாளையத்தினம் தன்னுடையவைகளுக்காகக் கவலைப்படும்; அந்தந்த நாளுக்கு அதினதின் பாடுபோதும்.", r:"மத்தேயு 6:34"},
 {v:"ஆகையால், நீங்கள் புறப்பட்டுப்போய், சகல ஜாதிகளையும் சீஷராக்கி, பிதா குமாரன் பரிசுத்த ஆவியின் நாமத்திலே அவர்களுக்கு ஞானஸ்நானங்கொடுத்து,", r:"மத்தேயு 28:19"},
 {v:"மனுஷர் உங்களுக்கு எப்படிச் செய்யவேண்டுமென்று விரும்புகிறீர்களோ, அப்படியே நீங்களும் அவர்களுக்குச் செய்யுங்கள்.", r:"லூக்கா 6:31"},
 {v:"ஆதியிலே வார்த்தை இருந்தது, அந்த வார்த்தை தேவனிடத்திலிருந்தது, அந்த வார்த்தை தேவனாயிருந்தது.", r:"யோவான் 1:1"},
 {v:"நீங்கள் என்னிலும், என் வார்த்தைகள் உங்களிலும் நிலைத்திருந்தால், நீங்கள் கேட்டுக்கொள்ளுவதெதுவோ அது உங்களுக்குச் செய்யப்படும்.", r:"யோவான் 15:7"},
 {v:"ஒருவன் தன் சிநேகிதருக்காகத் தன் ஜீவனைக் கொடுக்கிற அன்பிலும் அதிகமான அன்பு ஒருவரிடத்திலுமில்லை.", r:"யோவான் 15:13"},
 {v:"அதற்கு அவர்கள்: கர்த்தராகிய இயேசுகிறிஸ்துவை விசுவாசி, அப்பொழுது நீயும் உன் வீட்டாரும் இரட்சிக்கப்படுவீர்கள் என்று சொல்லி,", r:"அப்போஸ்தலர் 16:31"},
 {v:"நாம் பாவிகளாயிருக்கையில் கிறிஸ்து நமக்காக மரித்ததினாலே, தேவன் நம்மேல் வைத்த தமது அன்பை விளங்கப்பண்ணுகிறார்.", r:"ரோமர் 5:8"},
 {v:"பாவத்தின் சம்பளம் மரணம்; தேவனுடைய கிருபைவரமோ நம்முடைய கர்த்தராகிய இயேசுகிறிஸ்துவினால் உண்டான நித்தியஜீவன்.", r:"ரோமர் 6:23"},
 {v:"இவைகளைக்குறித்து நாம் என்ன சொல்லுவோம்? தேவன் நம்முடைய பட்சத்திலிருந்தால் நமக்கு விரோதமாயிருப்பவன் யார்?", r:"ரோமர் 8:31"},
 {v:"இவையெல்லாவற்றிலேயும் நாம் நம்மில் அன்புகூருகிறவராலே முற்றும் ஜெயங்கொள்ளுகிறவர்களாயிருக்கிறோமே.", r:"ரோமர் 8:37"},
 {v:"ஆதலால் விசுவாசம் கேள்வியினாலே வரும், கேள்வி தேவனுடைய வசனத்தினாலே வரும்.", r:"ரோமர் 10:17"},
 {v:"நீ தீமையினாலே வெல்லப்படாமல், தீமையை நன்மையினாலே வெல்லு.", r:"ரோமர் 12:21"},
 {v:"இப்பொழுது விசுவாசம், நம்பிக்கை, அன்பு இம்மூன்றும் நிலைத்திருக்கிறது; இவைகளில் அன்பே பெரியது.", r:"1 கொரிந்தியர் 13:13"},
 {v:"உங்கள் காரியங்களெல்லாம் அன்போடே செய்யப்படக்கடவது.", r:"1 கொரிந்தியர் 16:14"},
 {v:"கர்த்தரே ஆவியானவர்; கர்த்தருடைய ஆவி எங்கேயோ அங்கே விடுதலையுமுண்டு.", r:"2 கொரிந்தியர் 3:17"},
 {v:"இந்தத் தேகத்தில் குடியிருக்கையில் கர்த்தரிடத்தில் குடியிராதவர்களாயிருக்கிறோமென்று அறிந்தும், எப்பொழுதும் தைரியமாயிருக்கிறோம்.", r:"2 கொரிந்தியர் 5:7"},
 {v:"அவனவன் விசனமாயுமல்ல, கட்டாயமாயுமல்ல, தன் மனதில் நியமித்தபடியே கொடுக்கக்கடவன்; உற்சாகமாய்க் கொடுக்கிறவனிடத்தில் தேவன் பிரியமாயிருக்கிறார்.", r:"2 கொரிந்தியர் 9:7"},
 {v:"ஆனபடியினாலே, நீங்கள் மறுபடியும் அடிமைத்தனத்தின் நுகத்துக்குட்படாமல், கிறிஸ்து நமக்கு உண்டாக்கின சுயாதீன நிலைமையிலே நிலைகொண்டிருங்கள்.", r:"கலாத்தியர் 5:1"},
 {v:"நன்மைசெய்கிறதில் சோர்ந்துபோகாமல் இருப்போமாக; நாம் தளர்ந்துபோகாதிருந்தால் ஏற்றகாலத்தில் அறுப்போம்.", r:"கலாத்தியர் 6:9"},
 {v:"ஒருவருக்கொருவர் தயவாயும் மனஉருக்கமாயும் இருந்து, கிறிஸ்துவுக்குள் தேவன் உங்களுக்கு மன்னித்ததுபோல, நீங்களும் ஒருவருக்கொருவர் மன்னியுங்கள்.", r:"எபேசியர் 4:32"},

/* ============ CODE (no need to edit below) ============ */
function $(id){ return document.getElementById(id); }
function query(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : null;
}
function shuffle(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var debug = query('debug') !== null;
if (debug) $('dbg').style.display = 'block';
function log(t){ if (debug) $('dbg').innerHTML = t; }

/* ---- verses: shuffled deck, no repeats until all shown ---- */
var deck = [], vi = 0;
function nextVerse(){
  if (vi >= deck.length) { deck = shuffle(verses); vi = 0; }
  return deck[vi++];
}

/* ---- auto-fit: the verse always fits the screen, whatever its length ---- */
function fit(){
  var H = window.innerHeight || 384;
  var frame = $('frame'), content = $('content'), verse = $('verse'), ref = $('ref');
  var avail = H * 0.84;
  var size = Math.round(H * 0.125);          // start large (about 48px on a 384px-high area)
  var min = Math.round(H * 0.05);
  while (size >= min) {
    verse.style.fontSize = size + 'px';
    ref.style.fontSize = Math.round(size * 0.62) + 'px';
    if (content.offsetHeight <= avail) break;
    size -= 2;
  }
}
function showVerse(first){
  var c = $('content'), n = nextVerse();
  var apply = function(){
    $('verse').innerHTML = n.v;
    $('ref').innerHTML = n.r;
    fit();
    c.className = '';
  };
  if (first) { apply(); return; }
  c.className = 'out';
  setTimeout(apply, 950);
}

/* ---- background video: skip bad links, never leave a black screen ---- */
var vid = $('bgvideo'), order = [], vp = 0, failCount = 0, watchdog = null;
function loadVideo(){
  if (!VIDEOS.length) return;
  if (failCount >= VIDEOS.length) { vid.className = ''; log('all videos failed - gradient only'); return; }
  if (vp >= order.length) { order = shuffle(VIDEOS); vp = 0; }
  var src = order[vp++];
  vid.className = '';
  clearTimeout(watchdog);
  vid.muted = true;
  vid.src = src;
  vid.load();
  var p = vid.play();
  if (p && p['catch']) p['catch'](function(){});
  log('loading: ' + src);
  watchdog = setTimeout(function(){ failCount++; loadVideo(); }, 12000);  // 12 s without playing = skip
}
vid.addEventListener('playing', function(){
  clearTimeout(watchdog); failCount = 0; vid.className = 'on'; log('playing: ' + vid.src);
});
vid.addEventListener('error', function(){ clearTimeout(watchdog); failCount++; loadVideo(); });

/* ---- start ---- */
deck = shuffle(verses);
var forced = query('v');                       // optional: index.html?v=3 shows verse number 3
if (forced !== null && verses[parseInt(forced, 10)]) { deck.unshift(verses[parseInt(forced, 10)]); }
showVerse(true);
loadVideo();
setInterval(function(){ showVerse(false); }, VERSE_SECONDS * 1000);
setInterval(function(){ loadVideo(); }, VIDEO_SECONDS * 1000);
window.onresize = fit;
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); }  // refit when Tamil font arrives
</script>
